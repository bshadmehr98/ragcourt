name: Bug report
description: Something ragcourt did wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command and its output
      description: The exact command, and the output or error (redact anything private). Never attach private documents or .ragcourt/.
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`ragcourt --version`, Python, Ollama, OS"
    validations:
      required: true
  - type: textarea
    id: models
    attributes:
      label: Models and settings
      description: "`ragcourt models`, and ragcourt.toml if you changed it (without keys)"
      render: text
