name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"   # the tests read and write their files as UTF-8, also on Windows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:   # never run before release: the first CI run says whether Windows and macOS work
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with: { python-version: "${{ matrix.python }}", enable-cache: true }
      # Every extra and the dev dependency group (installed by default).
      - run: uv sync --all-extras --no-extra local --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_layers.py
      - run: uv run python scripts/check_simple.py
      - run: uv run pyright
      # Default suite only: pyproject's addopts deselect the real_model marker.
      - run: uv run pytest --cov --cov-fail-under=90
  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv build
      - name: Smoke test the wheel in a clean env
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          # dependencies that are git sources (not on PyPI yet) are installed first
          mapfile -t SOURCES < <(python3 scripts/git-sources.py)
          if [ "${#SOURCES[@]}" -gt 0 ]; then uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "${SOURCES[@]}"; fi
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -c "import ragcourt; print(ragcourt.__version__)"
          # the recording and the bundled corpus are in the wheel
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/smoke/bin/ragcourt" demo -q > /dev/null && test -f .ragcourt/demo/report.html)
          if [ -f examples/quickstart.py ]; then   # the README quickstart, with only the wheel installed
            cd "$RUNNER_TEMP" && "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/examples/quickstart.py"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with: { name: dist, path: dist/ }
