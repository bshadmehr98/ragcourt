[project]
name = "ragdoctor"
dynamic = ["version"]
description = "Rank chunkers, embedding models, retrievers and rerankers on your own documents, and say which stage caused each miss."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bahman Shadmehr", email = "info@bshadmehr.me" }]
keywords = ["rag", "retrieval", "chunking", "embeddings", "reranking", "evaluation", "benchmark", "llm"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
# The core is the standard library alone (design/decisions.md D-003). Optional extras (tokenizers, local
# models, adapters for chunking libraries) arrive with the milestones that use them (design §7.4).
dependencies = []

[project.scripts]
ragdoctor = "ragdoctor.cli:main"

[dependency-groups]
# Development tools (PEP 735): installed by `uv sync`, never published as an extra.
dev = [
    "pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.3", "hypothesis>=6.100",
    "ruff>=0.6", "pyright>=1.1.380",
]

[project.urls]
Homepage = "https://github.com/bshadmehr98/ragdoctor"
Repository = "https://github.com/bshadmehr98/ragdoctor"
Issues = "https://github.com/bshadmehr98/ragdoctor/issues"
Changelog = "https://github.com/bshadmehr98/ragdoctor/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ragdoctor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdoctor"]

[tool.hatch.build.targets.sdist]
include = [
    "src/", "tests/", "docs/", "examples/", "design/", "scripts/", "README.md", "CONTRIBUTING.md",
    "AGENTS.md", "LICENSE", "CHANGELOG.md", "pyproject.toml",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "S", "C4", "DTZ", "PL", "C90"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "PT018", "E501", "PLC0415", "PLR0915"]
"examples/**" = ["S101", "S108", "PT018", "T201"]
"scripts/**" = ["T201"]

[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not real_model'"
timeout = 120
markers = [
    "e2e: acceptance-case tests (run by default)",
    "real_model: a real embedding, chat or reranking model (local or an endpoint); run by hand, see CONTRIBUTING.md",
    "slow: slower than 5 s",
]

[tool.coverage.run]
branch = true
source = ["src/ragdoctor"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]
